<div class="content-panel" style="margin-bottom: 25px; border: 1px solid #3b82f6; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-radius: 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);">
    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, rgba(15, 23, 42, 0) 100%);">
        <h3 style="color: #3b82f6; margin: 0; display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.5px;">
            <i class="fas fa-users-cog"></i> Alocação Geral do Campo (Frentes e Líderes)
        </h3>
        <button class="btn-primary-blue" onclick="window.carregarAlocacaoCampo()" style="padding: 5px 15px; font-size: 0.85rem; font-weight: bold;">🔄 Recarregar</button>
    </div>
    
    <div style="padding: 15px;">
        <div class="table-modern-wrapper">
            <table class="data-table-modern" style="width: 100%; border-collapse: collapse; text-align: center;">
                <thead>
                    <tr style="background-color: rgba(30, 41, 59, 0.9); color: #94a3b8; text-transform: uppercase; font-size: 0.75rem;">
                        <th style="padding: 12px 10px; text-align: left;">Operador</th>
                        <th style="padding: 12px 10px;">Função (Líder/Op)</th>
                        <th style="padding: 12px 10px;">Turno</th>
                        <th style="padding: 12px 10px;">Equipe (Regime)</th>
                        <th style="padding: 12px 10px;">Frente Vinculada</th>
                        <th style="padding: 12px 10px;">Máquina Específica</th>
                        <th style="padding: 12px 10px;">Ação Rápida</th>
                    </tr>
                </thead>
                <tbody id="alocacaoCampoList"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modalAlocacaoRapida" class="modal-overlay">
    <div class="custom-modal">
        <div class="modal-header">
            <h3>⚙️ Ajuste Rápido de Alocação</h3>
            <button class="close-modal" onclick="window.fecharModalAlocacaoRapida()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="alocFormId">
            <p style="color: #fff; font-size: 1.1rem; margin-bottom: 15px;">Ajustando: <strong id="alocNomeExibicao" style="color: #38bdf8;"></strong></p>
            
            <div class="form-group-dark">
                <label>Função</label>
                <select id="alocFormFuncao" class="dark-select">
                    <option value="Operador de Máquina">Operador de Máquina</option>
                    <option value="Líder de Campo">Líder de Campo</option>
                </select>
            </div>
            
            <div class="form-group-dark">
                <label>Frente Vinculada</label>
                <select id="alocFormMaquina" class="dark-select"></select>
            </div>
            
            <div class="form-group-dark">
                <label>Máquina Específica</label>
                <select id="alocFormMaquinaEspecifica" class="dark-select">
                    <option value="">Indefinido / Todas</option>
                    <option value="Máquina 1">Máquina 1</option>
                    <option value="Máquina 2">Máquina 2</option>
                    <option value="Máquina 3">Máquina 3</option>
                </select>
            </div>
            
            <div class="form-group-dark">
                <label>Equipe</label>
                <select id="alocFormEquipe" class="dark-select">
                    <option value="Fixo Frente A">Fixo Frente A</option>
                    <option value="Fixo Frente B">Fixo Frente B</option>
                    <option value="Folguista">Folguista</option>
                </select>
            </div>
            
            <div class="form-group-dark">
                <label>Turno</label>
                <select id="alocFormTurno" class="dark-select">
                    <option value="06:00 - 18:00">06:00 - 18:00 (Dia)</option>
                    <option value="18:00 - 06:00">18:00 - 06:00 (Noite)</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary-dark" onclick="window.fecharModalAlocacaoRapida()">Cancelar</button>
            <button class="btn-primary-green" onclick="window.salvarAlocacaoRapida()">💾 Salvar Alocação</button>
        </div>
    </div>
</div>
