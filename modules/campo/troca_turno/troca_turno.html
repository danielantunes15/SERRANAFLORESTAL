<div class="action-bar" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 15px; background-color: rgba(30, 41, 59, 0.5); border-bottom: 1px solid rgba(255,255,255,0.05);">
    <div class="filter-group" style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
        <div style="display: flex; align-items: center; background: rgba(0, 0, 0, 0.25); border-radius: 6px; padding: 2px 10px; border: 1px solid #4b5563;">
            <span style="margin-right: 8px; font-size: 1rem; opacity: 0.8;">📅</span>
            <input type="date" id="filtroDataTrocaCampo" style="background: transparent; border: none; color: #f8fafc; outline: none; font-size: 0.85rem; padding: 4px 0; cursor: pointer; color-scheme: dark;" onchange="window.renderizarTrocaTurnoCampo()">
        </div>
        
        <label for="filtroFrenteTroca" style="font-size: 0.8rem; color: #9ca3af; font-weight: 600; text-transform: uppercase;">Frente:</label>
        <select id="filtroFrenteTroca" class="dark-select" style="padding: 2px 8px; font-size: 0.85rem; border-radius: 6px; height: 30px;" onchange="window.renderizarTrocaTurnoCampo()">
            <option value="todos">Todas as Frentes</option>
            <option value="Frente A">Frente A</option>
            <option value="Frente B">Frente B</option>
        </select>
    </div>
    
    <div class="button-group">
        <button class="btn-primary-green" style="background-color: #10b981; padding: 4px 12px; font-size: 0.8rem; height: 30px; font-weight: bold;" onclick="window.abrirModalNovaTrocaCampo()">📝 Registrar Passagem</button>
    </div>
</div>

<div id="trocaTurnoCampoContainer" style="padding: 15px;">
    </div>

<div id="modalNovaTrocaCampo" class="modal-overlay">
    <div class="custom-modal" style="max-width: 600px;">
        <div class="modal-header">
            <h3>📝 Nova Passagem de Turno - Campo</h3>
            <button class="close-modal" onclick="window.fecharModalNovaTrocaCampo()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group-dark">
                <label>Frente de Trabalho</label>
                <select id="novaTrocaFrente" class="dark-select">
                    <option value="Frente A">Frente A</option>
                    <option value="Frente B">Frente B</option>
                </select>
            </div>
            <div class="form-group-dark">
                <label>Líder Saindo</label>
                <input type="text" id="novaTrocaLiderSaindo" placeholder="Nome do Líder do Turno Atual">
            </div>
            <div class="form-group-dark">
                <label>Líder Entrando</label>
                <input type="text" id="novaTrocaLiderEntrando" placeholder="Nome do Líder do Próximo Turno">
            </div>
            <div class="form-group-dark">
                <label>Status Operacional do Campo & Máquinas</label>
                <textarea id="novaTrocaStatusMaquinas" rows="4" placeholder="Descreva as condições das máquinas, metas atingidas e pendências..." style="width:100%; background:#1e293b; color:#fff; border:1px solid #4b5563; border-radius:6px; padding:10px; font-family:inherit; resize:vertical;"></textarea>
            </div>
            <div class="form-group-dark">
                <label>Observações / Ocorrências Técnicas</label>
                <textarea id="novaTrocaObservacoes" rows="3" placeholder="Informações adicionais de SSMA, clima ou restrições..." style="width:100%; background:#1e293b; color:#fff; border:1px solid #4b5563; border-radius:6px; padding:10px; font-family:inherit; resize:vertical;"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary-dark" onclick="window.fecharModalNovaTrocaCampo()">Cancelar</button>
            <button class="btn-primary-green" onclick="window.salvarTrocaTurnoCampo()">💾 Salvar Registro</button>
        </div>
    </div>
</div>
