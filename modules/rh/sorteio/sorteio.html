            <div>
                <h2 style="color: var(--ccol-green-bright); font-size: 2rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 20px rgba(61,220,132,0.2);"><i class="fas fa-gift"></i> Arena de Premiação</h2>
