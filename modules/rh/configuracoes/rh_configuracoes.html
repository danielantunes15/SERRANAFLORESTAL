<div class="action-bar" style="animation: terminalFadeIn 0.3s ease-out;">
    <div class="filter-group">
        <h2 style="color: #fff; margin-right: 20px;"><i class="fas fa-cogs"></i> Configurações Base do RH</h2>
    </div>
    <div class="button-group">
        <button class="btn-primary-green" onclick="window.salvarRHConfiguracoes()"><i class="fas fa-save"></i> Salvar Configurações</button>
    </div>
</div>

<div class="content-panel" style="padding: 30px; animation: terminalFadeIn 0.3s ease-out;">
    <h4 style="color: var(--ccol-blue-bright); border-bottom: 1px solid rgba(96, 165, 250, 0.2); padding-bottom: 8px; margin-bottom: 25px;"><i class="fas fa-percent"></i> Métricas Financeiras e Sindicais</h4>
    
    <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        <div class="form-group-dark">
            <label>Porcentagem de Desconto do Sindicato (%)</label>
            <input type="number" id="cfgRhPercSindicato" step="0.01" placeholder="Ex: 1.5">
            <small style="color: var(--text-secondary); margin-top: 5px; display: block;">Valor percentual que será aplicado sobre o salário base dos colaboradores associados.</small>
        </div>
        <!-- Você pode adicionar mais campos aqui no futuro, como "Valor Vale Alimentação", etc. -->
    </div>
</div>
