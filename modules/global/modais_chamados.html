<div id="modalMeusChamados" class="modal-overlay" style="z-index: 2000;">
    <div class="custom-modal" style="max-width: 750px; border-top: 4px solid #a855f7;">
        <div class="modal-header">
            <h3><i class="fas fa-headset" style="color: #a855f7;"></i> Meus Chamados de Suporte</h3>
            <button class="close-modal" onclick="window.fecharPainelMeusChamados()">&times;</button>
        </div>
        <div class="modal-body" style="padding: 20px;">
            <button class="btn-primary-blue btn-full" onclick="window.abrirModalNovoChamado()" style="margin-bottom: 20px; font-size: 1.05rem; padding: 12px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <i class="fas fa-plus-circle"></i> Abrir Novo Chamado
            </button>
            
            <div style="max-height: 350px; overflow-y: auto; border: 1px solid var(--border-dim); border-radius: 8px; background: rgba(0,0,0,0.2);">
                <table class="data-table-modern" style="width: 100%;">
                    <thead>
                        <tr>
                            <th style="width: 60px;">#ID</th>
                            <th>Data</th>
                            <th>Título</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabelaMeusChamados">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="modalChamadoSuporte" class="modal-overlay" style="z-index: 2010;">
    <div class="custom-modal" style="max-width: 650px; border-top: 4px solid var(--ccol-blue-bright);">
        <div class="modal-header" style="background: rgba(0,0,0,0.2); padding-bottom: 15px; border-bottom: 1px solid var(--border-dim);">
            <div>
                <h3 style="margin-bottom: 5px;"><i class="fas fa-ticket-alt" style="color: var(--ccol-blue-bright);"></i> Registrar Novo Chamado</h3>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0;">Descreva o problema detalhadamente para agilizar o atendimento da equipe de TI.</p>
            </div>
            <button class="close-modal" onclick="window.fecharModalNovoChamado()">&times;</button>
        </div>
        <div class="modal-body" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px;">
            
            <div class="form-group-dark">
                <label><i class="fas fa-tag"></i> Tipo de Solicitação</label>
                <select id="chamadoTipo" class="dark-select" style="background-color: #1e293b; color: #f8fafc; border: 1px solid #475569;">
                    <option value="Bug/Erro">🐞 Bug/Erro no Sistema</option>
                    <option value="Dúvida">❓ Dúvida de Uso</option>
                    <option value="Melhoria">💡 Sugestão de Melhoria</option>
                    <option value="Acesso">🔑 Problema de Acesso/Permissão</option>
                </select>
            </div>
            
            <div class="form-group-dark">
                <label><i class="fas fa-layer-group"></i> Módulo Relacionado</label>
                <select id="chamadoModulo" class="dark-select" style="background-color: #1e293b; color: #f8fafc; border: 1px solid #475569;">
                    <option value="Geral/Não sei">Geral / Não sei informar</option>
                    <option value="Logística">Logística (Frota, Escala, etc)</option>
                    <option value="Manutenção">Manutenção (OS, Serviços)</option>
                    <option value="Monitoramento">Monitoramento (Jornadas, Gruas)</option>
                    <option value="SSMA">SSMA (Treinamentos, Recados)</option>
                    <option value="Almoxarifado">Almoxarifado</option>
                    <option value="Controladoria">Controladoria</option>
                    <option value="Indicadores">Indicadores/Dashboards</option>
                </select>
            </div>

            <div class="form-group-dark" style="grid-column: span 2;">
                <label><i class="fas fa-exclamation-triangle" style="color: #fb923c;"></i> Nível de Urgência (Impacto na operação)</label>
                <select id="chamadoUrgencia" class="dark-select" style="background-color: #1e293b; color: #f8fafc; border: 1px solid #475569; border-left: 3px solid #fb923c;">
                    <option value="Baixa">🟢 Baixa (Dúvida ou Melhoria - Não trava o trabalho)</option>
                    <option value="Média" selected>🟡 Média (Erro pontual - Consigo contornar temporariamente)</option>
                    <option value="Alta">🔴 Alta (Sistema travado - Operação parada / Crítico)</option>
                </select>
            </div>

            <div class="form-group-dark" style="grid-column: span 2;">
                <label><i class="fas fa-heading"></i> Título Resumido</label>
                <input type="text" id="chamadoTitulo" placeholder="Ex: Erro tela branca ao tentar salvar a escala..." style="background-color: #1e293b; color: #f8fafc; border: 1px solid #475569;">
            </div>

            <div class="form-group-dark" style="grid-column: span 2;">
                <label><i class="fas fa-align-left"></i> Descrição Detalhada</label>
                <textarea id="chamadoDescricao" rows="5" placeholder="Passo a passo do que você estava fazendo e qual o erro exato que apareceu na tela..." style="background-color: #1e293b; color: #f8fafc; border: 1px solid #475569;"></textarea>
            </div>
        </div>
        <div class="modal-footer" style="background: rgba(0,0,0,0.2); border-top: 1px solid var(--border-dim);">
            <button class="btn-secondary-dark" onclick="window.fecharModalNovoChamado()">Cancelar</button>
            <button class="btn-primary-blue" onclick="window.salvarChamadoSuporte()" id="btnSalvarChamado" style="font-size: 1rem; padding: 10px 25px;"><i class="fas fa-paper-plane"></i> Enviar Chamado</button>
        </div>
    </div>
</div>

<div id="modalChatChamado" class="modal-overlay" style="z-index: 2020;">
    <div class="custom-modal" style="max-width: 600px; border-top: 4px solid var(--ccol-green-bright);">
        <div class="modal-header">
            <h3 id="chatTituloHeader"><i class="fas fa-comments"></i> Chat do Chamado</h3>
            <button class="close-modal" onclick="window.fecharChatChamado()">&times;</button>
        </div>
        <div class="modal-body" style="padding: 0;">
            <div id="chatMensagensContainer" style="height: 350px; overflow-y: auto; padding: 20px; background: #0f172a; display: flex; flex-direction: column; gap: 15px;">
                </div>
            
            <div style="padding: 15px; background: var(--bg-panel); border-top: 1px solid var(--border-dim); display: flex; gap: 10px; align-items: center;">
                <textarea id="chatNovaMensagem" rows="2" style="flex: 1; resize: none; border-radius: 8px; background-color: #1e293b; color: #f8fafc; border: 1px solid #475569; padding: 10px;" placeholder="Digite sua resposta ou complemento aqui..."></textarea>
                <button class="btn-primary-green" onclick="window.enviarMensagemUsuario()" id="btnEnviarMensagemUsuario" style="height: 100%; min-height: 50px; padding: 0 20px; border-radius: 8px;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>
