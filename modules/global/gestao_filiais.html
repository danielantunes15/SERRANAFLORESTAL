<!-- CDN do SweetAlert2 para os alertas modernos -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    .global-container { font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; animation: fadeIn 0.4s ease-in-out; padding: 20px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .global-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 15px; border-bottom: 1px solid #334155; }
    .global-header h2 { margin: 0; color: #ffffff; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; font-weight: bold; }
    .global-header h2 i { color: #3b82f6; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .kpi-card { background: #1e293b; border-radius: 12px; padding: 20px; display: flex; align-items: center; gap: 20px; border: 1px solid #334155; }
    .kpi-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .kpi-info h3 { margin: 0; font-size: 1.8rem; color: #f8fafc; font-weight: 700; line-height: 1.2; }
    .kpi-info p { margin: 0; color: #94a3b8; font-size: 0.95rem; font-weight: 500; text-transform: uppercase; }

    .dark-table-container { background: #1e293b; border-radius: 12px; overflow-x: auto; border: 1px solid #334155; }
    .dark-table { width: 100%; border-collapse: collapse; text-align: left; }
    .dark-table th { background-color: #0f172a; padding: 14px 20px; font-size: 0.85rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; }
    .dark-table td { padding: 14px 20px; border-bottom: 1px solid #334155; color: #e2e8f0; }
    .dark-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.05); }

    .btn-action-sm { padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; color: white; margin-left: 5px; }
    .btn-edit { background: #64748b; } .btn-edit:hover { background: #475569; }
    .btn-delete { background: #ef4444; } .btn-delete:hover { background: #dc2626; }
    .btn-primary { background: #3b82f6; padding: 10px 20px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary:hover { background: #2563eb; }
</style>

<div class="global-container">
    <div class="global-header">
        <h2><i class="fas fa-building"></i> Gestão de Filiais (Matriz e Unidades)</h2>
        <button class="btn-primary" onclick="abrirModalFilial()"><i class="fas fa-plus"></i> Cadastrar Filial</button>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-icon" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa;"><i class="fas fa-network-wired"></i></div>
            <div class="kpi-info"><p>Total de Filiais</p><h3 id="kpiTotalFiliais">0</h3></div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon" style="background: rgba(16, 185, 129, 0.2); color: #34d399;"><i class="fas fa-check-circle"></i></div>
            <div class="kpi-info"><p>Filiais Ativas</p><h3 id="kpiFiliaisAtivas">0</h3></div>
        </div>
    </div>

    <div class="dark-table-container">
        <table class="dark-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome da Filial / Matriz</th>
                    <th>CNPJ</th>
                    <th>Localização (Cidade)</th>
                    <th>Status</th>
                    <th style="text-align: right;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaFiliaisBody">
                <tr><td colspan="6" style="text-align: center; padding: 20px;">Carregando filiais...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalFilial" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center;">
    <div style="background: #1e293b; width: 100%; max-width: 500px; border-radius: 12px; padding: 30px; border: 1px solid #334155; position: relative;">
        <span onclick="document.getElementById('modalFilial').style.display='none'" style="position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #94a3b8;">&times;</span>
        <h3 id="modalFilialTitulo" style="margin-top: 0; color: #fff; margin-bottom: 20px;">Nova Filial</h3>
        
        <form id="formFilial" onsubmit="salvarFilial(event)">
            <input type="hidden" id="filialId">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem;">Nome Fantasia / Identificação</label>
                <input type="text" id="filialNome" required style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem;">CNPJ</label>
                <input type="text" id="filialCnpj" placeholder="00.000.000/0000-00" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem;">Cidade (Pode incluir UF se desejar)</label>
                <input type="text" id="filialCidade" placeholder="Ex: Itabatã - BA" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 5px; color: #cbd5e1; font-size: 0.9rem;">Status</label>
                <select id="filialStatus" style="width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px;">
                    <option value="Ativa">🟢 Ativa (Operando)</option>
                    <option value="Inativa">🔴 Inativa (Bloqueada)</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;"><i class="fas fa-save"></i> Salvar Filial</button>
        </form>
    </div>
</div>
