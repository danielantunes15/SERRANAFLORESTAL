<style>
    .action-dropdown-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 5px);
        background: #1e293b;
        border: 1px solid var(--border-dim);
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        min-width: 230px;
        z-index: 9999;
        display: none;
        flex-direction: column;
        overflow: hidden;
        animation: terminalFadeIn 0.2s ease-out;
    }
    .action-dropdown-menu button {
        background: transparent;
        border: none;
        color: var(--text-primary);
        padding: 14px 15px;
        text-align: left;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: background 0.2s;
        border-bottom: 1px solid rgba(255,255,255,0.02);
    }
    .action-dropdown-menu button:last-child {
        border-bottom: none;
    }
    .action-dropdown-menu button:hover {
        background: rgba(255,255,255,0.05);
        color: #fff;
    }
    .table-paginated-wrapper {
        min-height: 400px;
        padding-bottom: 50px;
    }
    
    /* Melhorias de Design da Tabela SSMA */
    #tbListaColaboradoresSSMA td {
        white-space: nowrap; /* Impede a quebra de linha */
        vertical-align: middle;
    }
    .cpf-cell {
        text-align: center;
        font-size: 0.85rem; /* Letra um pouco menor */
        color: var(--ccol-blue-bright);
        font-weight: 700;
        letter-spacing: 0.5px;
    }
</style>

<div id="viewListagemColaboradoresSSMA" style="animation: terminalFadeIn 0.4s ease-out;">
    <div class="action-bar" style="display: flex; flex-wrap: wrap; gap: 15px;">
        <div class="filter-group" style="flex: 1; display: flex; gap: 10px; min-width: 300px; align-items: center;">
            <h2 style="color: #fff; margin-right: 15px; white-space: nowrap;">
                <i class="fas fa-hard-hat" style="color: #3b82f6;"></i> Colaboradores (SSMA)
            </h2>
            
            <input type="text" id="filtroCpfSSMA" class="search-input-dark" style="width: 160px;" placeholder="Buscar CPF..." onkeyup="window.filtrarColaboradoresSSMA()">
            <input type="text" id="filtroNomeSSMA" class="search-input-dark" style="flex: 1;" placeholder="Buscar por Nome ou Função..." onkeyup="window.filtrarColaboradoresSSMA()">
        </div>
    </div>
    
    <div class="content-panel" style="padding: 0;">
        <div class="table-paginated-wrapper" style="overflow-x: auto;">
            <table class="data-table-modern" style="margin: 0; border: none; min-width: 1000px;">
                <thead>
                    <tr>
                        <th style="width: 140px; text-align: center; white-space: nowrap;">CPF</th>
                        <th style="text-align: left; white-space: nowrap;">Colaborador</th>
                        <th style="width: 250px; text-align: left; white-space: nowrap;">Cargo / Função</th>
                        <th style="width: 120px; text-align: center; white-space: nowrap;">Status</th>
                        <th style="text-align: right; width: 180px; white-space: nowrap;">Ações de SSMA</th>
                    </tr>
                </thead>
                <tbody id="tbListaColaboradoresSSMA">
                    <tr><td colspan="5" style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Carregando...</td></tr>
                </tbody>
            </table>
        </div>
        
        <!-- CONTROLES DE PAGINAÇÃO -->
        <div id="paginacaoSSMA" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-top: 1px solid var(--border-dim); background: rgba(0,0,0,0.2);">
            <span id="infoPaginacaoSSMA" style="color: var(--text-secondary); font-size: 0.85rem;">Carregando...</span>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button id="btnPagePrevSSMA" class="btn-secondary-dark" style="padding: 6px 12px; font-size: 0.85rem;" onclick="window.mudarPaginaSSMA(-1)"><i class="fas fa-chevron-left"></i> Anterior</button>
                <span id="displayPageSSMA" style="color: #fff; font-weight: bold; padding: 6px 12px; font-size: 0.95rem; background: rgba(255,255,255,0.05); border-radius: 4px; border: 1px solid var(--border-dim);">1</span>
                <button id="btnPageNextSSMA" class="btn-secondary-dark" style="padding: 6px 12px; font-size: 0.85rem;" onclick="window.mudarPaginaSSMA(1)">Próxima <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>
