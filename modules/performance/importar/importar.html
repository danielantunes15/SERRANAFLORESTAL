<!-- modules/performance/importar/importar.html -->
<div class="content-area">
    <div class="table-card full-width" style="margin-bottom: 24px;">
        <h3><i class="fas fa-file-excel"></i> Importar Dados de Viagens</h3>
        <div class="upload-area" id="uploadArea" style="border: 2px dashed #475569; border-radius: 16px; padding: 48px; text-align: center; margin: 24px 0; background: #0f172a; cursor: pointer; transition: 0.2s;">
            <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: #3b82f6; margin-bottom: 15px;"></i>
            <h2>Clique ou arraste o arquivo Excel aqui</h2>
            <p style="color: #64748b; margin-top: 8px;">Suporte para arquivos .xlsx e .xls</p>
            <input type="file" id="excel-input" accept=".xlsx, .xls" style="display: none;">
        </div>
        <div id="import-status"></div>
    </div>
    
    <div class="table-card full-width">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="margin: 0;"><i class="fas fa-list"></i> Resumo da Última Importação</h3>
            <span class="status-badge success" id="trip-count">0 registros válidos</span>
        </div>
        <div class="table-wrapper">
            <table style="width: 100%; border-collapse: collapse;">
                <thead>
                    <tr>
                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #334155;">Motorista</th>
                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #334155;">Distância (Km)</th>
                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #334155;">KM/L</th>
                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #334155;">Litros</th>
                        <th style="text-align: left; padding: 10px; border-bottom: 1px solid #334155;">Início</th>
                    </tr>
                </thead>
                <tbody id="trips-list"></tbody>
            </table>
        </div>
    </div>
</div>
