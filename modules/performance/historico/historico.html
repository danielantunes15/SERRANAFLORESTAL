<!-- ==================== modules/performance/historico/historico.html ==================== -->
<div class="content-area">
    <div class="content-panel">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3><i class="fas fa-history" style="color: #3b82f6; margin-right: 8px;"></i> Histórico Completo de Viagens</h3>
            <span id="historico-count" style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 5px 12px; border-radius: 8px; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 0.85rem; font-weight: bold;">
                0 registros
            </span>
        </div>
        
        <!-- BARRA DE FILTROS -->
        <div style="padding: 15px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-dim); display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
            <div class="form-group-dark" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                <label>Colaborador (Motorista) ou Placa</label>
                <input type="text" id="filtroHistoricoBusca" placeholder="Pesquise por nome ou placa..." class="dark-select" style="margin-bottom: 0;" onkeyup="if(event.key === 'Enter') window.tripsModule.aplicarFiltros()">
            </div>
            <div class="form-group-dark" style="width: 160px; margin-bottom: 0;">
                <label>Data Inicial</label>
                <input type="date" id="filtroHistoricoInicio" class="dark-select" style="margin-bottom: 0;">
            </div>
            <div class="form-group-dark" style="width: 160px; margin-bottom: 0;">
                <label>Data Final</label>
                <input type="date" id="filtroHistoricoFim" class="dark-select" style="margin-bottom: 0;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary-blue" onclick="window.tripsModule.aplicarFiltros()" style="height: 42px;"><i class="fas fa-search"></i> Buscar</button>
                <button class="btn-secondary-dark" onclick="window.tripsModule.limparFiltros()" style="height: 42px;"><i class="fas fa-eraser"></i> Limpar</button>
            </div>
        </div>

        <!-- TABELA -->
        <div class="table-wrapper">
            <table class="data-table-modern" style="width: 100%; margin: 0;">
                <thead style="background: rgba(0,0,0,0.2);">
                    <tr>
                        <th>Colaborador / Motorista</th>
                        <th>Início (Data/Hora)</th>
                        <th>Fim (Data/Hora)</th>
                        <th>Distância (Km)</th>
                        <th>Média KM/L</th>
                        <th>Total Litros</th>
                    </tr>
                </thead>
                <tbody id="historico-list">
                    <tr><td colspan="6" style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Carregando viagens...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- PAGINAÇÃO -->
        <div id="historico-pagination" style="padding: 15px 20px; display: flex; justify-content: center; align-items: center; gap: 20px; background: rgba(0,0,0,0.1); border-top: 1px solid var(--border-dim);">
            <!-- Os botões serão injetados via JavaScript -->
        </div>
    </div>
</div>
