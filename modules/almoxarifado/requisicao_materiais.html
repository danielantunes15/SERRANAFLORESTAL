<div class="content-panel" style="padding: 25px; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 80vh;">
    <h2 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-shopping-basket" style="color: var(--ccol-blue-bright);"></i> Central de Requisição de Peças
    </h2>
    <p style="color: var(--text-secondary); margin-bottom: 25px; margin-top: 15px; font-size: 0.95rem;">
        Solicite materiais e peças diretamente para a equipe do almoxarifado.
    </p>

    <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; margin-bottom: 30px;">
        <h3 style="margin-top: 0; color: #34d399; font-size: 1.1rem; margin-bottom: 15px;">
            <i class="fas fa-plus-circle"></i> Criar Nova Requisição
        </h3>
        
        <form id="formRequisicaoMecanico" onsubmit="enviarRequisicaoPeca(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; align-items: end;">
            
            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem;">Nº da Ordem de Serviço (O.S)</label>
                <input type="number" id="reqOsId" placeholder="Aperte Enter para buscar Placa" required>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem;">Placa (Frota Associada)</label>
                <input type="text" id="reqPlaca" placeholder="Aguardando O.S..." readonly style="background: #334155;">
            </div>

            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem;">Selecione a Peça (Estoque Atual)</label>
                <select id="reqPecaSelect" class="dark-select" required>
                    <option value="">Carregando estoque...</option>
                </select>
            </div>

            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem;">Quantidade Necessária</label>
                <input type="number" step="0.01" id="reqQuantidade" placeholder="Ex: 2" required>
            </div>
            
            <div style="margin-bottom: 0;">
                <button type="submit" id="btnReqSalvar" class="btn-primary-blue" style="height: 38px; width: 100%; font-weight: bold; justify-content: center; gap: 8px;">
                    <i class="fas fa-paper-plane"></i> Enviar Solicitação
                </button>
            </div>
        </form>
    </div>

    <h3 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; font-size: 1.1rem;">
        <i class="fas fa-list-alt"></i> Minhas Solicitações (Últimos 15 dias)
    </h3>
    
    <div style="overflow-x: auto; background: #0f172a; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
        <table class="dark-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead>
                <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2);">
                    <th style="padding: 12px; font-weight: 600; color: #cbd5e1;">Data</th>
                    <th style="padding: 12px; font-weight: 600; color: #cbd5e1;">O.S / Frota</th>
                    <th style="padding: 12px; font-weight: 600; color: #cbd5e1;">Peça Solicitada</th>
                    <th style="padding: 12px; font-weight: 600; color: #cbd5e1;">Qtd</th>
                    <th style="padding: 12px; font-weight: 600; color: #cbd5e1;">Status no Almoxarifado</th>
                </tr>
            </thead>
            <tbody id="listaMinhasRequisicoes">
                <tr><td colspan="5" style="text-align: center; padding: 20px;">Buscando requisições...</td></tr>
            </tbody>
        </table>
    </div>
</div>
