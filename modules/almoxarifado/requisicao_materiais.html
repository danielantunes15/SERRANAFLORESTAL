<style>
    .req-container { font-family: 'Segoe UI', system-ui, sans-serif; color: #e2e8f0; animation: fadeIn 0.4s ease-in-out; display: flex; flex-direction: column; gap: 20px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .req-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .req-header h2 { margin: 0; color: #ffffff; font-size: 1.8rem; display: flex; align-items: center; gap: 10px; font-weight: bold; }
    
    .req-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media(max-width: 900px) { .req-grid { grid-template-columns: 1fr; } }
    
    .req-box { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .req-box h3 { margin-top: 0; margin-bottom: 15px; color: #38bdf8; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px dashed #334155; padding-bottom: 10px; }
    
    .req-form-group { margin-bottom: 15px; }
    .req-form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; font-size: 0.9rem; }
    .req-form-group select, .req-form-group input { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 8px; outline: none; transition: 0.2s; font-size: 1rem; }
    .req-form-group select:focus, .req-form-group input:focus { border-color: #3b82f6; }
    .req-form-group select:disabled, .req-form-group input:disabled { background: #334155; cursor: not-allowed; color: #94a3b8; }
    
    /* Autocomplete Inteligente (Design Moderno) */
    .autocomplete-wrapper { position: relative; }
    .autocomplete-results { position: absolute; top: 100%; left: 0; width: 100%; background: #0f172a; border: 1px solid #3b82f6; border-radius: 8px; max-height: 280px; overflow-y: auto; z-index: 9999; display: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6); margin-top: 5px; }
    .autocomplete-results::-webkit-scrollbar { width: 8px; }
    .autocomplete-results::-webkit-scrollbar-thumb { background-color: #3b82f6; border-radius: 4px; }
    .autocomplete-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; color: #f8fafc; transition: 0.2s; }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover { background: #1e293b; }
    .autocomplete-item.disabled { color: #ef4444; cursor: not-allowed; background: rgba(15, 23, 42, 0.8); opacity: 0.6; }
    .autocomplete-item.disabled:hover { background: rgba(15, 23, 42, 0.8); }

    .btn-req { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 1rem; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-add { background: #3b82f6; color: white; margin-top: 10px; } .btn-add:hover { background: #2563eb; }
    .btn-submit { background: #10b981; color: white; margin-top: 20px; font-size: 1.1rem; } .btn-submit:hover { background: #059669; }
    .btn-remove { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 1.1rem; transition: 0.2s; } .btn-remove:hover { color: #dc2626; transform: scale(1.1); }
    
    .req-table { width: 100%; border-collapse: collapse; text-align: left; }
    .req-table th { background-color: #0f172a; padding: 12px; font-size: 0.85rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; border-bottom: 1px solid #334155; }
    .req-table td { padding: 12px; border-bottom: 1px solid #334155; color: #f8fafc; font-size: 0.95rem; }
    .req-table tr:last-child td { border-bottom: none; }
    
    .empty-cart { text-align: center; padding: 30px; color: #64748b; font-style: italic; }
    .empty-cart i { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

    /* Modal de Confirmação */
    .almo-modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 9999; align-items: center; justify-content: center; }
    .almo-modal-content { background: #1e293b; color: #e2e8f0; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); padding: 40px; border: 1px solid #334155; text-align: center; animation: popIn 0.3s ease-out; }
    @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
</style>

<div class="req-container">
    <div class="req-header">
        <h2><i class="fas fa-hand-holding-medical" style="color: #60a5fa;"></i> Requisitar Material do Almoxarifado</h2>
    </div>

    <div class="req-grid">
        <!-- SELEÇÃO DE PRODUTOS -->
        <div class="req-box">
            <h3><i class="fas fa-search"></i> 1. Seleção de Material</h3>
            
            <div class="req-form-group">
                <label>Para qual Colaborador (EPI, Ferramenta, etc)?</label>
                <select id="reqColaborador">
                    <option value="">Carregando colaboradores...</option>
                </select>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 15px; margin-bottom: 15px;">
                <div class="req-form-group" style="margin-bottom: 0;">
                    <label>Filtrar Categoria</label>
                    <select id="reqCategoria" onchange="filtrarPecasRequisicao()">
                        <option value="TODOS">Todas as Categorias</option>
                    </select>
                </div>
                
                <div class="req-form-group autocomplete-wrapper" style="margin-bottom: 0;">
                    <label>Pesquisar Peça / Produto</label>
                    <input type="text" id="reqBuscaPeca" placeholder="🔍 Digite o nome ou código..." autocomplete="off" onkeyup="filtrarPecasRequisicao()" onfocus="filtrarPecasRequisicao()">
                    <input type="hidden" id="reqPecaId">
                    <div id="reqListaResultados" class="autocomplete-results"></div>
                </div>
            </div>
            
            <div style="display: flex; gap: 15px; align-items: flex-end;">
                <div class="req-form-group" style="flex: 1; margin-bottom: 0;">
                    <label>Quantidade a Requisitar</label>
                    <input type="number" id="reqQuantidade" value="1" min="0.01" step="0.01">
                </div>
                <div class="req-form-group" style="flex: 1; margin-bottom: 0;">
                    <label>Disp. no Estoque</label>
                    <input type="text" id="reqEstoqueDisponivel" readonly placeholder="Aguardando Seleção" style="color: #34d399; font-weight: bold; text-align: center; background: #0f172a;">
                </div>
            </div>
            
            <button class="btn-req btn-add" onclick="adicionarPecaCarrinho()">
                <i class="fas fa-cart-plus"></i> Adicionar à Lista
            </button>
        </div>

        <!-- CARRINHO -->
        <div class="req-box" style="display: flex; flex-direction: column;">
            <h3><i class="fas fa-clipboard-list" style="color: #a855f7;"></i> 2. Lista de Requisição</h3>
            
            <div style="flex: 1; overflow-y: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155;">
                <table class="req-table" id="tabelaCarrinho">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th style="width: 80px; text-align: center;">Qtd</th>
                            <th style="width: 50px; text-align: center;">Excluir</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCarrinho">
                        <tr>
                            <td colspan="3">
                                <div class="empty-cart">
                                    <i class="fas fa-box-open"></i><br>
                                    Nenhum item adicionado à lista.
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <button class="btn-req btn-submit" id="btnEnviarRequisicao" onclick="enviarRequisicaoFinal()" disabled>
                <i class="fas fa-paper-plane"></i> Enviar Solicitação ao Almoxarifado
            </button>
        </div>
    </div>
</div>

<!-- MODAL DE SUCESSO -->
<div id="modalConfirmacaoReq" class="almo-modal">
    <div class="almo-modal-content" style="max-width: 450px;">
        <i class="fas fa-check-circle" style="font-size: 4.5rem; color: #10b981; margin-bottom: 20px;"></i>
        <h2 style="color: #f8fafc; font-size: 1.8rem; margin-bottom: 10px;">Solicitação Enviada!</h2>
        <p style="color: #94a3b8; font-size: 1.05rem; margin-bottom: 25px; line-height: 1.5;">
            O Almoxarifado já recebeu seu pedido.<br>
            Aguarde a aprovação e separação do material.
        </p>
        <button class="btn-req btn-submit" onclick="document.getElementById('modalConfirmacaoReq').style.display='none'" style="margin: 0;">
            OK, Entendi
        </button>
    </div>
</div>
