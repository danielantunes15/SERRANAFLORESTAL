<div class="content-panel" style="padding: 25px; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 80vh;">
    <h2 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-shopping-basket" style="color: var(--ccol-blue-bright);"></i> Requisições de Materiais Gerais
    </h2>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; margin-bottom: 20px;">
        <p style="color: var(--text-secondary); margin: 0; font-size: 0.9rem;">
            Acompanhe o status dos seus pedidos ou solicite novos itens para a sua área.
        </p>
        <button class="btn-primary-green" onclick="abrirModalNovaRequisicao()" style="font-size: 1rem; padding: 10px 20px;">
            <i class="fas fa-plus"></i> Fazer Nova Requisição
        </button>
    </div>

    <div style="overflow-x: auto;">
        <table class="dark-table" style="width: 100%; border-collapse: collapse; margin-top: 10px;">
            <thead>
                <tr style="text-align: left; background: rgba(255,255,255,0.02);">
                    <th style="padding: 12px; width: 60px;">ID</th>
                    <th style="padding: 12px; width: 140px;">Data da Solicitação</th>
                    <th style="padding: 12px;">Solicitante</th>
                    <th style="padding: 12px;">Centro de Custo (Apropriação)</th>
                    <th style="padding: 12px;">Itens Solicitados</th>
                    <th style="padding: 12px; text-align: center;">Status</th>
                    <th style="padding: 12px; text-align: center; width: 120px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyRequisicoes">
                <tr><td colspan="7" style="text-align: center; padding: 20px;">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalNovaRequisicao" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 9999;">
    <div class="custom-modal" style="background: #1e293b; border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; width: 100%; max-width: 550px;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="color: #f8fafc; margin: 0; font-size: 1.2rem; font-weight: 600;">
                <i class="fas fa-file-signature" style="color: #4ade80;"></i> Criar Requisição
            </h3>
            <button onclick="fecharModalNovaRequisicao()" style="background: none; border: none; color: #cbd5e1; font-size: 1.4rem; cursor: pointer; line-height: 1;">&times;</button>
        </div>
        <div class="modal-body">
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 6px;">O custo será apropriado para:</label>
                <select id="reqCentroCusto" class="dark-select" style="width: 100%;">
                    <option value="">Carregando...</option>
                </select>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 6px;">Descreva os Itens e as Quantidades Desejadas</label>
                <textarea id="reqItens" class="dark-select" style="width: 100%; height: 100px; resize: vertical;" placeholder="Ex: 02 Caixas de Papel A4&#10;05 Canetas Azuis&#10;01 Sabonete Líquido"></textarea>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 6px;">Justificativa / Motivo da Requisição</label>
                <textarea id="reqJustificativa" class="dark-select" style="width: 100%; height: 60px; resize: vertical;" placeholder="Opcional. Ex: Fim do estoque no setor corporativo."></textarea>
            </div>
            
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 20px;">
            <button class="btn-secondary-dark" onclick="fecharModalNovaRequisicao()">Cancelar</button>
            <button class="btn-primary-green" onclick="salvarNovaRequisicao()">
                <i class="fas fa-paper-plane"></i> Enviar Solicitação
            </button>
        </div>
    </div>
</div>

<div id="modalAtenderRequisicao" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 9999;">
    <div class="custom-modal" style="background: #1e293b; border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; width: 100%; max-width: 550px;">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px;">
            <h3 style="color: #f8fafc; margin: 0; font-size: 1.2rem; font-weight: 600;">
                <i class="fas fa-clipboard-check" style="color: var(--ccol-blue-bright);"></i> Atender Requisição
            </h3>
            <button onclick="fecharModalAtender()" style="background: none; border: none; color: #cbd5e1; font-size: 1.4rem; cursor: pointer; line-height: 1;">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="atenderReqId">
            
            <div style="background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px;">
                <p style="margin: 0 0 5px 0; color: #fde047; font-size: 0.85rem; font-weight: bold;">📝 O que foi pedido:</p>
                <div id="atenderItensDetalhes" style="color: #f8fafc; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.4;"></div>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 6px;">Atualizar Status</label>
                <select id="atenderStatus" class="dark-select" style="width: 100%;">
                    <option value="Pendente">🟡 Pendente (Aguardando Análise)</option>
                    <option value="Aprovado">🔵 Aprovado (Separando Material)</option>
                    <option value="Entregue">🟢 Entregue (Finalizado)</option>
                    <option value="Rejeitado">🔴 Rejeitado (Cancelado)</option>
                </select>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="color: var(--text-secondary); display: block; margin-bottom: 6px;">Observações do Almoxarife (Para o Solicitante)</label>
                <textarea id="atenderObs" class="dark-select" style="width: 100%; height: 80px; resize: vertical;" placeholder="Ex: Entregue parcialmente, o resto chega terça-feira."></textarea>
            </div>
            
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 20px;">
            <button class="btn-secondary-dark" onclick="fecharModalAtender()">Cancelar</button>
            <button class="btn-primary-blue" onclick="salvarAtendimentoRequisicao()">
                <i class="fas fa-save"></i> Gravar Atendimento
            </button>
        </div>
    </div>
</div>
