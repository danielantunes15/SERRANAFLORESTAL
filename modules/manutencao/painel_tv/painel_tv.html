<link rel="stylesheet" href="modules/manutencao/painel_tv/painel_tv.css">

<div id="painelTvFundo">
    
    <header id="tvHeader">
        <div class="tv-brand">
            <div class="tv-title-row">
                <h1>PÁTIO DE MANUTENÇÃO</h1>
                <span class="tv-live-badge">
                    <span class="tv-live-dot"></span> AO VIVO
                </span>
            </div>
            <div class="tv-controls">
                <button id="btnTvFullScreen" class="tv-btn" onclick="toggleFullScreenTV()">
                    <i class="fas fa-expand"></i> Tela Cheia
                </button>
                <button id="btnTvAudio" class="tv-btn tv-btn-audio" onclick="toggleAudioTV()">
                    <i class="fas fa-volume-up"></i> Som Ativo
                </button>
            </div>
        </div>
        
        <div id="tvKpis">
            <div class="kpi-group kpi-group-os">
                <div class="kpi-box">
                    <div class="kpi-label">O.S. (HOJE)</div>
                    <div id="tvKpiTotal" class="kpi-value">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">ABERTAS</div>
                    <div id="tvKpiAbertas" class="kpi-value kpi-text-amber">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">FECHADAS</div>
                    <div id="tvKpiFechadas" class="kpi-value kpi-text-green">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">TAXA DM</div>
                    <div id="tvKpiDM" class="kpi-value">0%</div>
                </div>
            </div>

            <div class="kpi-group kpi-group-tritrem">
                <div class="kpi-box">
                    <div class="kpi-label">TRITRENS DISP. 🚚</div>
                    <div id="tvKpiDisponiveis" class="kpi-value kpi-text-green">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">TRITRENS MANUT. 🔧</div>
                    <div id="tvKpiEmManutencao" class="kpi-value kpi-text-blue">0</div>
                </div>
            </div>

            <div class="kpi-group kpi-group-grua">
                <div class="kpi-box">
                    <div class="kpi-label">GRUAS DISP. 🏗️</div>
                    <div id="tvKpiGruasDisponiveis" class="kpi-value kpi-text-green">0</div>
                </div>
                <div class="kpi-box">
                    <div class="kpi-label">GRUAS MANUT. 🔧</div>
                    <div id="tvKpiGruasManutencao" class="kpi-value kpi-text-amber">0</div>
                </div>
            </div>
        </div>

        <div class="tv-clock-box">
            <h2 id="tvRelogio">00:00:00</h2>
            <span id="tvData"></span>
        </div>
    </header>
    
    <main id="tvCardsContainer"></main>
    
    <footer id="tvPaginationContainer"></footer>
</div>
