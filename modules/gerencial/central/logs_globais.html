<div class="content-panel">
    <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
        <h2><i class="fas fa-shield-alt"></i> Auditoria de Logs Globais</h2>
        <div class="header-actions" style="display: flex; gap: 10px; align-items: center;">
            <select id="filtroFilialLogs" class="dark-select" onchange="mudarFiltroFilialLogs()" style="display: none; padding: 6px; font-size: 0.9rem;">
                <option value="TODAS">Todas as Filiais</option>
            </select>
            <button class="btn-primary-blue" onclick="carregarLogsGlobais()"><i class="fas fa-sync"></i> Atualizar</button>
        </div>
    </div>
    
    <div class="panel-body">
        <div class="table-responsive" style="min-height: 400px; max-height: 60vh; overflow-y: auto;">
            <table class="dark-table" style="width: 100%;">
                <thead style="position: sticky; top: 0; background: var(--bg-panel); z-index: 2;">
                    <tr>
                        <th style="width: 15%;">Data/Hora</th>
                        <th style="width: 15%;">Usuário</th>
                        <th style="width: 15%;">Filial</th>
                        <th style="width: 15%;">Ação</th>
                        <th style="width: 40%;">Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tbodyLogsGlobais">
                    <tr><td colspan="5" style="text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Carregando logs da sessão...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="pagination-controls" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-dim);">
            <button class="btn-secondary-dark" id="btnPrevLogs" onclick="mudarPaginaLogs(-1)" disabled><i class="fas fa-chevron-left"></i> Anterior</button>
            <span style="color: #fff; font-size: 0.9rem; text-align: center;">
                Página <strong id="lblPaginaAtualLogs" style="color: var(--ccol-blue-bright);">1</strong> de <strong id="lblTotalPaginasLogs">1</strong> 
                <br><span style="font-size: 0.75rem; color: var(--text-secondary);">Total: <span id="lblTotalRegistrosLogs">0</span> registros mapeados</span>
            </span>
            <button class="btn-secondary-dark" id="btnNextLogs" onclick="mudarPaginaLogs(1)"><i class="fas fa-chevron-right"></i> Próxima</button>
        </div>
    </div>
</div>
