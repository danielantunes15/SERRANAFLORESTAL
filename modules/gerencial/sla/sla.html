<div class="max-w-[96rem] mx-auto px-6 py-8 relative">          
    <div class="flex justify-between items-center mb-8 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 backdrop-blur-sm flex-wrap gap-4">
        <div>
            <h1 class="text-2xl font-extrabold text-white">SLA - Acordo de Nível de Serviço</h1>
            <p class="text-sm text-slate-400 font-medium">Acompanhamento Anual: Faturamento, Volume, Viagens e Desempenho por Grua</p>
        </div>
        <div class="flex items-center gap-3">
            <select id="slaAnoSelect" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white text-sm font-bold outline-none focus:border-sky-500 shadow-inner cursor-pointer">
                <option value="2027">2027</option>
                <option value="2026" selected>2026</option>
                <option value="2025">2025</option>
            </select>
            <button id="btnProcessarSLA" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded border border-sky-500 transition-all shadow-md flex items-center gap-2 text-sm">
                <i class="fas fa-sync-alt"></i> Atualizar
            </button>
        </div>
    </div>
    
    <!-- CARDS DE RESUMO ANUAL -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">                          
        <div class="bg-slate-800/60 border border-sky-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-sky-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Faturamento Anual</p>
                    <h3 id="slaTotalFaturamento" class="text-2xl font-black text-white mt-1">R$ 0,00</h3>
                </div>
                <div class="bg-slate-900 p-2 rounded-lg border border-slate-700 text-sky-400"><i class="fas fa-money-bill-wave"></i></div>
            </div>
        </div>
        
        <div class="bg-slate-800/60 border border-indigo-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-indigo-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Volume Anual (m³)</p>
                    <h3 id="slaTotalVolume" class="text-2xl font-black text-white mt-1">0 m³</h3>
                </div>
                <div class="bg-slate-900 p-2 rounded-lg border border-slate-700 text-indigo-400"><i class="fas fa-cubes"></i></div>
            </div>
        </div>

        <div class="bg-slate-800/60 border border-emerald-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Viagens Transporte</p>
                    <h3 id="slaTotalViagensTransp" class="text-2xl font-black text-white mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-2 rounded-lg border border-slate-700 text-emerald-400"><i class="fas fa-truck"></i></div>
            </div>
        </div>
        
        <div class="bg-slate-800/60 border border-purple-500/30 rounded-2xl p-5 shadow-lg relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-24 h-24 bg-purple-500/10 rounded-bl-full -mr-4 -mt-4 transition-transform group-hover:scale-110"></div>
            <div class="flex justify-between items-start mb-4">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Viagens Carregamento</p>
                    <h3 id="slaTotalViagensCarreg" class="text-2xl font-black text-white mt-1">0</h3>
                </div>
                <div class="bg-slate-900 p-2 rounded-lg border border-slate-700 text-purple-400"><i class="fas fa-tractor"></i></div>
            </div>
        </div>
    </div>

    <!-- GRÁFICO EVOLUÇÃO -->
    <div class="bg-slate-800/60 backdrop-blur-sm rounded-xl shadow-2xl p-6 border border-slate-700/50 w-full mb-8">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700/50 pb-3">
            <h3 class="font-bold text-white tracking-wide flex items-center text-sm md:text-base uppercase">
                <i class="fas fa-chart-line text-sky-400 mr-3 text-xl"></i> Evolução Anual - Mês a Mês
            </h3>
        </div>
        <div id="chartSlaEvolucao" style="width: 100%; height: 400px;"></div>
    </div>

    <!-- TABELAS MENSAIS DE GRUAS -->
    <div class="mb-4">
        <h3 class="font-bold text-white tracking-wide flex items-center text-sm md:text-base uppercase bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 shadow-md">
            <i class="fas fa-tractor text-emerald-400 mr-3 text-xl"></i> Resumo de Produção por Grua (Mês a Mês)
        </h3>
    </div>
    
    <div id="containerGruasMensal" class="flex flex-col gap-6 pb-8">
        <!-- Os cards de cada mês serão injetados aqui via JS -->
    </div>
</div>
