<style>
    /* CORREÇÃO DO FUNDO DO INPUT DE DATA NO HISTÓRICO */
    input[type="date"], input[type="time"] {
        background-color: rgba(15, 23, 42, 0.8) !important;
        color: #e2e8f0 !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        border-radius: 6px;
        padding: 8px 12px;
        color-scheme: dark;
        font-family: inherit;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        cursor: pointer;
        opacity: 0.7;
    }
</style>

<div class="content-panel" style="animation: fadeIn 0.3s ease;">
    <div class="panel-header">
        <h3><i class="fas fa-history"></i> Histórico de Ocorrências</h3>
    </div>
    
    <!-- Barra de Filtros -->
    <div style="display: flex; gap: 15px; padding: 15px 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border-dim); flex-wrap: wrap;">
        <div class="form-group-dark" style="flex: 1; min-width: 150px; margin-bottom: 0;">
            <label>Setor</label>
            <select id="filtroSetor" class="dark-select" onchange="renderizarHistoricoOcorrencias()">
                <option value="">Todos os Setores</option>
            </select>
        </div>
        <div class="form-group-dark" style="flex: 1; min-width: 150px; margin-bottom: 0;">
            <label>Envolvido / Responsável</label>
            <select id="filtroEnvolvido" class="dark-select" onchange="renderizarHistoricoOcorrencias()">
                <option value="">Todos os Envolvidos</option>
            </select>
        </div>
        <div class="form-group-dark" style="flex: 1; min-width: 150px; margin-bottom: 0;">
            <label>Placa</label>
            <select id="filtroPlaca" class="dark-select" onchange="renderizarHistoricoOcorrencias()">
                <option value="">Todas as Placas</option>
            </select>
        </div>
        <div class="form-group-dark" style="flex: 1; min-width: 150px; margin-bottom: 0;">
            <label>Data do Ocorrido</label>
            <input type="date" id="filtroData" onchange="renderizarHistoricoOcorrencias()">
        </div>
    </div>

    <!-- Tabela de Histórico -->
    <div class="table-responsive" style="padding: 20px; border-radius: 12px; overflow: hidden;">
        <table class="dark-table modern-turno-table" style="width: 100%; margin: 0;">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Setor</th>
                    <th>Nome Envolvido</th>
                    <th>Placa</th>
                    <th>Descrição</th>
                    <th style="text-align: center;">Status</th>
                    <th style="text-align: center;">Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyHistoricoOcorrencias">
                <tr><td colspan="8" style="text-align: center; padding: 20px;">Carregando histórico...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL DE EDIÇÃO CENTRALIZADO (COM TODOS OS CAMPOS DO BANCO) -->
<div id="modalEditarOcorrencia" class="modal-overlay" style="display:none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 10000; backdrop-filter: blur(4px);">
    <div class="custom-modal form-panel-dark" style="width: 95%; max-width: 1000px; background: var(--bg-panel); border: 1px solid var(--border-dim); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border-dim); background: rgba(0,0,0,0.2);">
            <h3 style="margin: 0; color: #fff;"><i class="fas fa-edit"></i> Editar Ocorrência Detalhada</h3>
            <button class="close-modal" onclick="fecharModalEdicaoOcorrencia()" style="background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        
        <div class="modal-body" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 20px; max-height: 70vh; overflow-y: auto;">
            <input type="hidden" id="edit_id">

            <!-- Linha 1 -->
            <div class="form-group-dark"><label>Data Ocorrido</label><input type="date" id="edit_data_ocorrido"></div>
            <div class="form-group-dark"><label>Hora Ocorrido</label><input type="time" id="edit_hora_ocorrido"></div>
            <div class="form-group-dark"><label>Local do Projeto</label><input type="text" id="edit_local_projeto" class="input-moderno"></div>

            <!-- Linha 2 -->
            <div class="form-group-dark"><label>Nº Frota</label><input type="text" id="edit_numero_frota" class="input-moderno"></div>
            <div class="form-group-dark"><label>Placa</label><input type="text" id="edit_placa" class="input-moderno" style="text-transform: uppercase;"></div>
            <div class="form-group-dark"><label>Modelo</label><input type="text" id="edit_modelo" class="input-moderno"></div>

            <!-- Linha 3 -->
            <div class="form-group-dark"><label>Setor</label><input type="text" id="edit_setor" class="input-moderno"></div>
            <div class="form-group-dark"><label>Tipo de Ocorrência</label><input type="text" id="edit_tipo_ocorrencia" class="input-moderno"></div>
            <div class="form-group-dark"><label>Status</label>
                <select id="edit_status" class="dark-select">
                    <option value="Aberta">Aberta</option>
                    <option value="Em Andamento">Em Andamento</option>
                    <option value="Resolvida">Resolvida</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
            </div>

            <!-- Linha 4 -->
            <div class="form-group-dark"><label>Nome do Envolvido (Principal)</label><input type="text" id="edit_nome_envolvido" class="input-moderno"></div>
            <div class="form-group-dark"><label>Função</label><input type="text" id="edit_funcao" class="input-moderno"></div>
            <div class="form-group-dark"><label>É Causador/Responsável?</label>
                <select id="edit_is_responsavel" class="dark-select">
                    <option value="true">Sim</option>
                    <option value="false">Não</option>
                </select>
            </div>

            <!-- Linha 5 -->
            <div class="form-group-dark"><label>Escala</label><input type="text" id="edit_escala" class="input-moderno"></div>
            <div class="form-group-dark"><label>Tempo de Empresa</label><input type="text" id="edit_tempo_empresa" class="input-moderno"></div>
            <div class="form-group-dark"><label>Valor Prejuízo (R$)</label><input type="number" step="0.01" id="edit_valor_prejuizo" class="input-moderno"></div>

            <!-- Linha 6 -->
            <div class="form-group-dark"><label>Empresa</label><input type="text" id="edit_empresa" class="input-moderno"></div>
            <div class="form-group-dark"><label>Nº OS (Ordem Serviço)</label><input type="text" id="edit_numero_os" class="input-moderno"></div>
            <div class="form-group-dark"><label>Data Abertura OS</label><input type="date" id="edit_data_abertura_os"></div>

            <!-- Linha 7 -->
            <div class="form-group-dark"><label>Gestor Imediato</label><input type="text" id="edit_gestor_imediato" class="input-moderno"></div>
            <div class="form-group-dark"><label>Gerente</label><input type="text" id="edit_gerente" class="input-moderno"></div>
            <div></div> <!-- Espaço em branco para alinhar -->

            <!-- Linha 8: Outros Envolvidos (Editáveis Dinamicamente) -->
            <div class="form-group-dark" style="grid-column: 1 / -1; display: none;" id="div_edit_outros_envolvidos">
                <label style="color: #60a5fa; font-weight: bold;"><i class="fas fa-users"></i> Outros Envolvidos / Equipamentos</label>
                <div id="container_edit_outros_envolvidos" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
                    <!-- Linhas geradas dinamicamente via JS -->
                </div>
            </div>

            <!-- Textareas de bloco inteiro -->
            <div class="form-group-dark" style="grid-column: 1 / -1; margin-top: 10px;">
                <label>Descrição dos Fatos</label>
                <textarea id="edit_descricao_fatos" class="input-moderno" rows="3" style="resize: vertical;"></textarea>
            </div>
            <div class="form-group-dark" style="grid-column: 1 / -1;">
                <label>Prevenção de Falha</label>
                <textarea id="edit_prevencao_falha" class="input-moderno" rows="3" style="resize: vertical;"></textarea>
            </div>
            <div class="form-group-dark" style="grid-column: 1 / -1;">
                <label>Parecer do Gestor</label>
                <textarea id="edit_parecer_gestor" class="input-moderno" rows="3" style="resize: vertical;"></textarea>
            </div>
        </div>
        
        <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid var(--border-dim); display: flex; justify-content: flex-end; gap: 10px; background: rgba(0,0,0,0.1);">
            <button class="btn-secondary-dark" onclick="fecharModalEdicaoOcorrencia()" style="padding: 10px 15px;">Cancelar</button>
            <button class="btn-primary-blue" onclick="salvarEdicaoOcorrencia()" style="padding: 10px 15px;"><i class="fas fa-save"></i> Salvar Alterações</button>
        </div>
    </div>
</div>
