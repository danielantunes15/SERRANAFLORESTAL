<div class="content-panel" style="padding: 20px; background: var(--bg-panel); border-radius: 8px; border: 1px solid var(--border-dim); min-height: 80vh;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
        <h2 style="color: #f8fafc; margin: 0;"><i class="fas fa-history" style="color: var(--ccol-blue-bright); margin-right: 10px;"></i> Histórico de Ocorrências</h2>
        <button class="btn-primary-blue" onclick="carregarHistoricoOcorrencias()"><i class="fas fa-sync-alt"></i> Atualizar Lista</button>
    </div>

    <div class="table-modern-wrapper">
        <table class="data-table-modern">
            <thead>
                <tr>
                    <th>Nº Ocorrência</th>
                    <th>Data</th>
                    <th>Placa</th>
                    <th>Envolvido</th>
                    <th>Gestor Imediato</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tbodyHistoricoOcorrencias">
                <tr><td colspan="6" style="text-align: center; padding: 20px;">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modalHistoricoOcorrencia" class="modal-overlay" style="display: none;">
    <div class="custom-modal" style="max-width: 800px; width: 95%;">
        <div class="modal-header">
            <h3 id="modalHistoricoOcorrenciaTitle">Detalhes da Ocorrência</h3>
            <div style="display: flex; gap: 10px;">
                <button id="btnImprimirModal" class="btn-primary-blue" style="padding: 4px 10px; font-size: 0.9rem;" onclick="imprimirOcorrenciaDoModal()"><i class="fas fa-print"></i> Imprimir Formulário</button>
                <button class="close-modal" onclick="fecharModalHistoricoOcorrencia()">&times;</button>
            </div>
        </div>
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
            <input type="hidden" id="hist_id">

            <fieldset style="border: 1px solid var(--border-dim); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.1);">
                <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 0.95rem;">Identificação do Veículo</legend>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                    <div class="form-group-dark"><label>Placa</label><input type="text" id="hist_placa" class="dark-select"></div>
                    <div class="form-group-dark"><label>Número da Frota</label><input type="text" id="hist_numero_frota" class="dark-select"></div>
                    <div class="form-group-dark"><label>Modelo</label><input type="text" id="hist_modelo" class="dark-select"></div>
                    <div class="form-group-dark"><label>Empresa</label><input type="text" id="hist_empresa" class="dark-select"></div>
                </div>
            </fieldset>

            <fieldset style="border: 1px solid var(--border-dim); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.1);">
                <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 0.95rem;">Dados do Ocorrido</legend>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                    <div class="form-group-dark" style="position: relative;">
                        <label>Nº O.S.</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="hist_numero_os" class="dark-select" style="flex: 1;">
                            <button id="btnVerOSHist" type="button" class="btn-primary-blue" onclick="window.visualizarOSVinculada()" style="display: none; padding: 0 12px; font-size: 0.9rem;" title="Visualizar Ordem de Serviço"><i class="fas fa-external-link-alt"></i></button>
                        </div>
                    </div>
                    <div class="form-group-dark"><label>Data</label><input type="date" id="hist_data_ocorrido" class="dark-select"></div>
                    <div class="form-group-dark"><label>Hora</label><input type="time" id="hist_hora_ocorrido" class="dark-select"></div>
                    <div class="form-group-dark" style="grid-column: span 2;"><label>Local / Projeto</label><input type="text" id="hist_local_projeto" class="dark-select"></div>
                    <div class="form-group-dark" style="grid-column: span 2;"><label>Nome do Envolvido</label><input type="text" id="hist_nome_envolvido" class="dark-select"></div>
                    <div class="form-group-dark"><label>Função</label><input type="text" id="hist_funcao" class="dark-select"></div>
                    <div class="form-group-dark"><label>Tempo de Empresa</label><input type="text" id="hist_tempo_empresa" class="dark-select"></div>
                    <div class="form-group-dark"><label>Escala</label><input type="text" id="hist_escala" class="dark-select"></div>
                </div>
            </fieldset>

            <fieldset style="border: 1px solid var(--border-dim); padding: 15px; margin-bottom: 15px; border-radius: 8px; background: rgba(0,0,0,0.1);">
                <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 0.95rem;">Relato dos Fatos</legend>
                <div class="form-group-dark" style="margin-bottom: 10px;">
                    <label>Descrição dos Fatos</label>
                    <textarea id="hist_descricao_fatos" class="dark-select" rows="3"></textarea>
                </div>
                <div class="form-group-dark" style="margin-bottom: 10px;">
                    <label>O que poderia ter sido feito para evitar?</label>
                    <textarea id="hist_prevencao_falha" class="dark-select" rows="2"></textarea>
                </div>
                <div class="form-group-dark" style="margin-bottom: 10px;">
                    <label>Parecer do Gestor</label>
                    <textarea id="hist_parecer_gestor" class="dark-select" rows="2"></textarea>
                </div>
            </fieldset>

            <fieldset style="border: 1px solid var(--border-dim); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.1);">
                <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 0.95rem;">Aprovações</legend>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group-dark"><label>Gestor Imediato</label><input type="text" id="hist_gestor_imediato" class="dark-select"></div>
                    <div class="form-group-dark"><label>Gerente</label><input type="text" id="hist_gerente" class="dark-select"></div>
                </div>
            </fieldset>

        </div>
        <div class="modal-footer">
            <button class="btn-secondary-dark" onclick="fecharModalHistoricoOcorrencia()">Fechar</button>
            <button id="btnSalvarEdicaoOcorrencia" class="btn-primary-green" onclick="salvarEdicaoOcorrencia()"><i class="fas fa-save"></i> Salvar Edição</button>
        </div>
    </div>
</div>
