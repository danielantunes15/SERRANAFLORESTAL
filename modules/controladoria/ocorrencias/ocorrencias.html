<style>
    /* Correção para o fundo branco nos inputs de data/mês/hora */
    input[type="date"].dark-select,
    input[type="month"].dark-select,
    input[type="time"].dark-select {
        color-scheme: dark;
    }
</style>
<div class="content-panel" style="padding: 20px; background: var(--bg-panel); border-radius: 8px; border: 1px solid var(--border-dim); min-height: 80vh;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
        <h2 style="color: #f8fafc; margin: 0;"><i class="fas fa-exclamation-triangle" style="color: #ef4444; margin-right: 10px;"></i> Registo de Ocorrências</h2>
    </div>

    <form id="formOcorrencia" onsubmit="window.salvarOcorrencia(event)">
        
        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Responsável / Envolvido Principal (Colaborador)</legend>
            
            <div style="display: flex; justify-content: flex-start; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; margin-bottom: 15px;">
                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; background: rgba(239, 68, 68, 0.1); padding: 8px 15px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3);">
                    <input type="checkbox" id="is_responsavel_principal" style="transform: scale(1.3); accent-color: #ef4444;">
                    <strong style="color: #ef4444;">Este é o causador / principal responsável da ocorrência</strong>
                </label>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group-dark">
                    <label for="nome_envolvido_select">Nome do Envolvido</label>
                    <select id="nome_envolvido_select" class="dark-select" required onchange="window.preencherDadosColaborador(this.value, 'funcao', 'nome_envolvido', 'tempo_empresa')">
                        <option value="">Carregando colaboradores...</option>
                    </select>
                    <input type="hidden" id="nome_envolvido" required>
                </div>
                <div class="form-group-dark">
                    <label for="funcao">Função</label>
                    <input type="text" id="funcao" class="dark-select" readonly required>
                </div>
                <div class="form-group-dark">
                    <label for="setor">Setor / Departamento</label>
                    <select id="setor" class="dark-select" required onchange="window.autoPreencherGestores()">
                        <option value="">Carregando setores...</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="tempo_empresa">Tempo de Empresa</label>
                    <input type="text" id="tempo_empresa" class="dark-select" readonly style="opacity: 0.7; cursor: not-allowed;" placeholder="Preenchimento automático">
                </div>
                <div class="form-group-dark">
                    <label for="escala">Escala</label>
                    <input type="text" id="escala" class="dark-select" placeholder="Ex: 5x2, 6x1...">
                </div>
            </div>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Equipamento Principal Envolvido</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group-dark">
                    <label for="categoria_frota">Categoria da Frota</label>
                    <select id="categoria_frota" class="dark-select" onchange="window.carregarFrotasOcorrencia()">
                        <option value="TRITREM">TRITREM</option>
                        <option value="PRANCHA">PRANCHA</option>
                        <option value="GRUA">GRUA</option>
                        <option value="COMBOIO">COMBOIO</option>
                        <option value="CARRETA">CARRETA</option>
                        <option value="Frota Leve">Frota Leve</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="placa">Placa (Veículo)</label>
                    <select id="placa" class="dark-select" required onchange="window.preencherDadosVeiculo(this.value)">
                        <option value="">Aguardando categoria...</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="numero_frota">Número da Frota</label>
                    <input type="text" id="numero_frota" class="dark-select" readonly style="opacity: 0.7; cursor: not-allowed;" placeholder="Preenchimento automático">
                </div>
                <div class="form-group-dark">
                    <label for="modelo">Modelo / Descrição</label>
                    <input type="text" id="modelo" class="dark-select" readonly style="opacity: 0.7; cursor: not-allowed;" placeholder="Preenchimento automático">
                </div>
                <div class="form-group-dark">
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" class="dark-select" value="SERRANALOG FLORESTAL" readonly style="opacity: 0.7; cursor: not-allowed;">
                </div>
            </div>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Outros Envolvidos (Colaboradores / Terceiros / Equipamentos Extras)</legend>
            <div id="lista_outros_envolvidos"></div>
            <button type="button" class="btn-secondary-dark" onclick="window.adicionarOutroEnvolvido()" style="margin-top: 10px; background: rgba(255,255,255,0.05); border: 1px dashed var(--border-dim); color: var(--ccol-blue-bright); padding: 10px 15px; border-radius: 8px; width: 100%; text-align: center; cursor: pointer; transition: all 0.3s;">
                <i class="fas fa-plus"></i> Adicionar Outro Envolvido na Ocorrência
            </button>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Dados do Ocorrido</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group-dark">
                    <label for="numero_os">Nº O.S. Vinculada (Opcional)</label>
                    <input type="text" id="numero_os" class="dark-select" placeholder="Ex: 1234" onblur="window.buscarDataOS(this.value, 'data_abertura_os')">
                </div>
                <div class="form-group-dark">
                    <label for="data_abertura_os">Data Abertura da O.S.</label>
                    <input type="date" id="data_abertura_os" class="dark-select" readonly style="opacity: 0.7; cursor: not-allowed;" title="Preenchimento automático após inserir a O.S.">
                </div>
                <div class="form-group-dark">
                    <label for="data_ocorrido">Data do Ocorrido</label>
                    <input type="date" id="data_ocorrido" class="dark-select" required>
                </div>
                <div class="form-group-dark">
                    <label for="hora_ocorrido">Hora do Ocorrido</label>
                    <input type="time" id="hora_ocorrido" class="dark-select" required>
                </div>
                <div class="form-group-dark" style="grid-column: span 2;">
                    <label for="local_projeto">Local / Projeto</label>
                    <input type="text" id="local_projeto" class="dark-select" required>
                </div>
            </div>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: #f59e0b; font-size: 1.1rem;">Classificação e Prejuízos</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group-dark">
                    <label for="tipo_ocorrencia">Tipo de Ocorrência / Avaria</label>
                    <select id="tipo_ocorrencia" class="dark-select" required>
                        <option value="Colisão">Colisão / Acidente</option>
                        <option value="Tombamento">Tombamento</option>
                        <option value="Avaria Mecânica">Avaria Mecânica</option>
                        <option value="Avaria Elétrica">Avaria Elétrica</option>
                        <option value="Mau Uso">Mau Uso do Equipamento</option>
                        <option value="Ambiental">Incidente Ambiental</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="status">Status Inicial</label>
                    <select id="status" class="dark-select" required>
                        <option value="Aberta">Aberta (Tratativa)</option>
                        <option value="Em Análise">Em Análise (Sindicância)</option>
                        <option value="Concluída">Concluída</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="valor_prejuizo">Valor Estimado do Prejuízo (R$)</label>
                    <input type="number" step="0.01" id="valor_prejuizo" class="dark-select" placeholder="0.00 (Deixar em branco se não houver)">
                </div>
            </div>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Relato dos Fatos</legend>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label for="descricao_fatos">Descrição dos Fatos</label>
                <textarea id="descricao_fatos" class="dark-select" rows="4" placeholder="Descreva detalhadamente como tudo ocorreu..." required></textarea>
            </div>
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label for="prevencao_falha">O que você poderia ter feito para evitar essa ocorrência?</label>
                <textarea id="prevencao_falha" class="dark-select" rows="3" required></textarea>
            </div>
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label for="parecer_gestor">Parecer do Gestor</label>
                <textarea id="parecer_gestor" class="dark-select" rows="3"></textarea>
            </div>
        </fieldset>

        <fieldset style="border: 1px solid var(--border-dim); padding: 20px; margin-bottom: 25px; border-radius: 8px; background: rgba(0,0,0,0.1);">
            <legend style="padding: 0 10px; font-weight: bold; color: var(--ccol-blue-bright); font-size: 1.1rem;">Aprovações</legend>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <div class="form-group-dark">
                    <label for="gestor_imediato">Nome do Gestor Imediato</label>
                    <select id="gestor_imediato" class="dark-select">
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="form-group-dark">
                    <label for="gerente">Nome do Gerente</label>
                    <select id="gerente" class="dark-select">
                        <option value="">Carregando...</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
            <button type="button" class="btn-primary-blue" onclick="window.imprimirFolhaEmBranco()"><i class="fas fa-print"></i> Imprimir Folha em Branco</button>
            <button type="button" class="btn-secondary-dark" onclick="window.limparFormOcorrencia()">Limpar</button>
            <button type="submit" class="btn-primary-green"><i class="fas fa-save"></i> Guardar Ocorrência</button>
        </div>
    </form>
</div>
