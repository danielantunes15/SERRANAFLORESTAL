<div class="content-panel" style="padding: 25px; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 80vh;">
    <h2 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-user-shield" style="color: var(--ccol-blue-bright);"></i> Controle de Menus e Acessos
    </h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px; margin-top: 15px; font-size: 0.9rem;">
        Configure as permissões de visibilidade dos módulos baseando-se no Cargo ou criando exceções para um Usuário Específico.
    </p>
    
    <div style="display: flex; gap: 24px; margin-bottom: 25px; background: rgba(255,255,255,0.02); padding: 15px 20px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); width: max-content;">
        <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; color: #f8fafc;">
            <input type="radio" name="tipoPermissao" value="perfil" checked onchange="window.mudarTipoPermissao('perfil')"> 
            Por Cargo Organizacional
        </label>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; color: #f8fafc;">
            <input type="radio" name="tipoPermissao" value="usuario" onchange="window.mudarTipoPermissao('usuario')"> 
            Por Usuário Específico
        </label>
    </div>

    <div class="form-group-dark" style="margin-bottom: 30px;">
        <select id="selectPerfilPermissao" class="dark-select" onchange="window.carregarCheckboxesPermissoes()" style="max-width: 400px;">
            <option value="" disabled selected>-- Selecione o Cargo --</option>
        </select>
        <select id="selectUsuarioPermissao" class="dark-select" style="display: none; max-width: 400px;" onchange="window.carregarCheckboxesPermissoes()">
            <option value="" disabled selected>-- Selecione o Usuário --</option>
        </select>
    </div>

    <div id="container-permissoes-menus" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;"></div>
    
    <div style="margin-top: 30px; text-align: right; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px;">
        <button class="btn-primary-blue" onclick="window.salvarPermissoes()" style="font-size: 1rem; padding: 10px 20px;">
            <i class="fas fa-save"></i> Salvar Matriz de Permissões
        </button>
    </div>
</div>
