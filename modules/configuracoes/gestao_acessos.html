<div class="content-panel" style="padding: 25px; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 80vh; position: relative; display: flex; flex-direction: column;">
    <h2 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-user-shield" style="color: var(--ccol-blue-bright);"></i> Controle de Menus e Acessos
    </h2>
    <p style="color: var(--text-secondary); margin-bottom: 20px; margin-top: 15px; font-size: 0.9rem;">
        Configure as permissões de visibilidade dos módulos baseando-se no Cargo ou criando exceções para um Usuário Específico.
    </p>

    <!-- CONTAINER DE SELEÇÃO DE FILIAL -->
    <div id="container-filial-permissao" class="form-group-dark" style="margin-bottom: 25px; display: none;">
        <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Selecione a Filial para Gerenciar</label>
        <select id="selectFilialContextoPermissao" class="dark-select" onchange="window.mudarFilialContexto()" style="max-width: 400px;">
            <option value="" disabled selected>Carregando filiais...</option>
        </select>
    </div>

    <!-- CONTROLES SUPERIORES (Segmented Control e Busca) -->
    <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; margin-bottom: 25px; background: rgba(255,255,255,0.02); padding: 15px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
        
        <!-- Segmented Control Moderno -->
        <div class="segmented-control" style="display: inline-flex; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
            <label class="segment-label" style="cursor: pointer; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: all 0.3s; color: #fff;">
                <input type="radio" name="tipoPermissao" value="perfil" checked onchange="window.mudarTipoPermissao('perfil')" style="display: none;">
                <i class="fas fa-briefcase"></i> Por Cargo
            </label>
            <label class="segment-label" style="cursor: pointer; padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: all 0.3s; color: #94a3b8;">
                <input type="radio" name="tipoPermissao" value="usuario" onchange="window.mudarTipoPermissao('usuario')" style="display: none;">
                <i class="fas fa-user"></i> Por Usuário
            </label>
        </div>

        <!-- Seleção do Cargo/Usuário -->
        <div class="form-group-dark" style="margin-bottom: 0; flex: 1; max-width: 350px;">
            <select id="selectPerfilPermissao" class="dark-select" onchange="window.carregarCheckboxesPermissoes(); window.resetarFeedbackSalvar();" disabled style="width: 100%;">
                <option value="" disabled selected>-- Aguardando Filial --</option>
            </select>
            <select id="selectUsuarioPermissao" class="dark-select" style="display: none; width: 100%;" onchange="window.carregarCheckboxesPermissoes(); window.resetarFeedbackSalvar();" disabled>
                <option value="" disabled selected>-- Aguardando Filial --</option>
            </select>
        </div>

        <!-- Barra de Busca -->
        <div class="form-group-dark" style="margin-bottom: 0; flex: 1; min-width: 250px;">
            <div style="position: relative;">
                <i class="fas fa-search" style="position: absolute; left: 12px; top: 13px; color: var(--text-secondary);"></i>
                <input type="text" id="buscaPermissoes" class="dark-select" placeholder="Buscar módulo ou permissão..." onkeyup="window.filtrarPermissoes(this.value)" style="padding-left: 35px; width: 100%;">
            </div>
        </div>
    </div>

    <!-- Matriz de Permissões -->
    <div id="container-permissoes-menus" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; flex: 1; margin-bottom: 60px;"></div>
    
    <!-- Sticky Footer para Salvar -->
    <div id="sticky-footer-salvar" style="position: sticky; bottom: -25px; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 25px; margin: 0 -25px -25px -25px; border-radius: 0 0 8px 8px; display: flex; justify-content: space-between; align-items: center; z-index: 100; box-shadow: 0 -10px 20px rgba(0,0,0,0.3);">
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="salvar-feedback" style="color: #f59e0b; font-size: 0.95rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; gap: 6px;">
                <i class="fas fa-exclamation-circle"></i> Alterações pendentes
            </span>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button id="btnRestaurarHeranca" class="btn-secondary-dark" onclick="window.restaurarHeranca()" style="display: none; padding: 10px 20px;">
                <i class="fas fa-undo"></i> Restaurar Padrão do Cargo
            </button>
            <button id="btnSalvarPermissoes" class="btn-primary-blue" onclick="window.salvarPermissoes()" style="font-size: 1rem; padding: 10px 24px; transition: all 0.3s;">
                <i class="fas fa-save"></i> Salvar Matriz de Permissões
            </button>
        </div>
    </div>
</div>

<style>
    /* Estilos do Segmented Control Moderno */
    .segmented-control input:checked + i { color: #fff; }
    .segmented-control label:has(input:checked) { background: #3b82f6; color: #fff !important; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    
    /* Estilos dos Cards Interativos e Badges */
    .permissao-card { transition: all 0.3s ease; }
    .permissao-card.card-active { border-color: rgba(59, 130, 246, 0.4); background: rgba(30, 41, 59, 0.8); box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
    
    .badge-herdado { font-size: 0.65rem; background: rgba(255,255,255,0.1); color: #cbd5e1; padding: 3px 6px; border-radius: 4px; margin-left: auto; letter-spacing: 0.5px; text-transform: uppercase;}
    .badge-excecao { font-size: 0.65rem; background: rgba(245,158,11,0.2); color: #f59e0b; padding: 3px 6px; border-radius: 4px; margin-left: auto; border: 1px solid rgba(245,158,11,0.3); letter-spacing: 0.5px; text-transform: uppercase; }
    
    /* Checkbox Customizado */
    .chk-permissao { accent-color: #10b981; }
    .chk-master { accent-color: #3b82f6; width: 18px; height: 18px; cursor: pointer; }
</style>
