<div class="content-panel" style="padding: 25px; background: #1e293b; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); min-height: 80vh;">
    <h2 style="color: #f8fafc; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-users" style="color: var(--ccol-blue-bright);"></i> Gestão de Usuários
    </h2>
    
    <!-- ÁREA DE CADASTRO -->
    <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 20px; margin-top: 20px; margin-bottom: 25px;">
        <h3 style="margin-top: 0; color: var(--ccol-blue-bright); font-size: 1.1rem; margin-bottom: 15px;">
            <i class="fas fa-user-plus"></i> Cadastrar Novo Usuário
        </h3>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; align-items: end;">
            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Nome Completo</label>
                <input type="text" id="novoNomeCompleto" class="dark-select" placeholder="Ex: JOÃO DA SILVA" autocomplete="off">
            </div>

            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Nome de Acesso (Username)</label>
                <input type="text" id="novoUsername" class="dark-select" placeholder="Ex: JOAO.SILVA" autocomplete="off">
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Filial de Lotação</label>
                <select id="novoUserFilial" class="dark-select" onchange="window.carregarCargosParaFilial(this.value)">
                    <option value="" disabled selected>Carregando filiais...</option>
                </select>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 0;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Cargo / Função Corporativa</label>
                <select id="novoUserCargo" class="dark-select">
                    <option value="" disabled selected>-- Selecione a Filial Primeiro --</option>
                </select>
            </div>
            
            <div style="margin-bottom: 0;">
                <button class="btn-primary-green" onclick="window.adicionarUsuario()" style="height: 42px; width: 100%; font-weight: bold; font-size: 0.9rem;">
                    <i class="fas fa-save"></i> Criar Usuário
                </button>
            </div>
        </div>
        
        <div style="margin-top: 15px; padding-top: 12px; border-top: 1px dashed rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-info-circle" style="color: var(--text-secondary);"></i>
            <span style="font-size: 0.8rem; color: var(--text-secondary);">
                A senha padrão para novos acessos é <strong>12345</strong>. O colaborador deverá alterá-la no primeiro login.
            </span>
        </div>
    </div>

    <!-- CABEÇALHO DA LISTAGEM COM BUSCA E FILTRO -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;">
        <h3 style="margin: 0; color: #f8fafc; font-size: 1.1rem; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-list"></i> Usuários Cadastrados
        </h3>
        
        <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
            <!-- Nova Barra de Busca -->
            <div class="form-group-dark" style="margin-bottom: 0; min-width: 250px;">
                <div style="position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 12px; top: 12px; color: var(--text-secondary);"></i>
                    <input type="text" id="buscaUsuario" class="dark-select" placeholder="Buscar por nome, usuário ou cargo..." onkeyup="window.filtrarUsuariosTabela(this.value)" style="padding-left: 35px; width: 100%; height: 38px;">
                </div>
            </div>

            <div id="filtroFilialContainer" style="display: none; align-items: center; gap: 10px;">
                <select id="filtroUsuariosFilial" class="dark-select" style="min-width: 200px; height: 38px;" onchange="window.renderizarUsuarios()">
                    <option value="TODAS">Todas as Filiais</option>
                    <option value="CENTRAL">Matriz Corporativa</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- TABELA DE USUÁRIOS -->
    <div class="table-modern-wrapper">
        <table class="data-table-modern" id="tableUsuariosList">
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 20px;">Colaborador</th>
                    <th>Cargo / Função</th>
                    <th>Filial Base</th>
                    <th>Status</th>
                    <th style="text-align: right; padding-right: 20px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaUsuarios">
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL DE EDIÇÃO -->
<div id="modalEdicaoUsuario" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); align-items: center; justify-content: center; z-index: 9999;">
    <div class="custom-modal" style="background: #1e293b; border: 1px solid rgba(255,255,255,0.05); padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 15px 30px rgba(0,0,0,0.5);">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 20px;">
            <h3 style="color: #f8fafc; margin: 0; font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-user-edit" style="color: var(--ccol-blue-bright);"></i> Alterar Cadastro
            </h3>
            <button onclick="window.fecharModalEdicaoUsuario()" style="background: none; border: none; color: #cbd5e1; font-size: 1.4rem; cursor: pointer; transition: color 0.2s;">&times;</button>
        </div>
        
        <div class="modal-body" style="padding: 0;">
            <input type="hidden" id="editUserId">
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Nome Completo</label>
                <input type="text" id="editNomeCompleto" class="dark-select" style="width: 100%;">
            </div>

            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Nome de Acesso (Username)</label>
                <input type="text" id="editUsername" class="dark-select" style="width: 100%;">
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 15px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Filial de Atuação</label>
                <select id="editUserFilial" class="dark-select" style="width: 100%;" onchange="window.carregarCargosParaFilialEdicao(this.value)">
                </select>
            </div>
            
            <div class="form-group-dark" style="margin-bottom: 20px;">
                <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 6px;">Cargo Atual / Nova Função</label>
                <select id="editUserCargo" class="dark-select" style="width: 100%;">
                </select>
            </div>
        </div>
        
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <button class="btn-secondary-dark" onclick="window.fecharModalEdicaoUsuario()" style="padding: 10px 18px;">Cancelar</button>
            <button class="btn-primary-green" onclick="window.salvarEdicaoUsuario()" style="padding: 10px 20px;">
                <i class="fas fa-check"></i> Salvar Alterações
            </button>
        </div>
    </div>
</div>
