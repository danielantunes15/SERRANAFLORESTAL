<div class="max-w-[96rem] mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-8 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
        <div>
            <h1 class="text-2xl font-extrabold text-white">Histórico de Produção</h1>
            <p class="text-sm text-slate-400 font-medium">Consulte, pesquise e audite a base de dados de viagens na nuvem</p>
        </div>
    </div>

    <section class="animate-fade-in space-y-6">
        <div class="bg-slate-800/60 backdrop-blur-sm rounded-xl shadow-2xl overflow-hidden border border-slate-700/50 flex flex-col h-[calc(100vh-12rem)]">
            <div class="bg-slate-800/80 px-6 py-5 border-b border-slate-700 flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4">
                <h3 class="font-bold text-white tracking-wide flex items-center text-lg whitespace-nowrap">
                    <i class="fas fa-database text-sky-500 mr-3"></i> Tabela Geral de Viagens
                </h3>
                <div class="flex flex-wrap items-center gap-3 w-full xl:w-auto relative">
                    <div class="relative w-full sm:w-auto">
                        <i class="fas fa-search absolute left-3 top-2.5 text-slate-500"></i>
                        <input type="text" id="searchHistorico" placeholder="Termo geral..." class="bg-slate-900 text-white text-sm rounded-lg border border-slate-600 pl-9 pr-4 py-2 focus:outline-none focus:border-sky-500 w-full sm:w-44 shadow-inner placeholder-slate-500 transition-colors">
                    </div>
                    <div class="relative w-full sm:w-auto">
                        <i class="fas fa-truck absolute left-3 top-2.5 text-slate-500"></i>
                        <input type="text" id="filterPlacaHist" placeholder="Placa/Cavalo" class="bg-slate-900 text-white text-sm rounded-lg border border-slate-600 pl-9 pr-4 py-2 focus:outline-none focus:border-sky-500 w-full sm:w-36 shadow-inner placeholder-slate-500 transition-colors">
                    </div>
                    <div class="relative w-full sm:w-auto">
                        <input type="date" id="filterDataHist" class="bg-slate-900 text-white text-sm rounded-lg border border-slate-600 px-3 py-2 focus:outline-none focus:border-sky-500 w-full sm:w-36 shadow-inner placeholder-slate-500 transition-colors">
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="btnFilterHist" title="Filtrar Dados" class="flex-1 bg-sky-600 hover:bg-sky-500 text-white border border-sky-500 px-4 py-2 rounded-lg text-sm font-bold transition-colors"><i class="fas fa-filter mr-1"></i> Filtrar</button>
                        <button id="btnClearHist" title="Limpar Filtros" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white border border-slate-500 px-4 py-2 rounded-lg text-sm font-bold transition-colors"><i class="fas fa-eraser"></i></button>
                    </div>
                </div>
            </div>
            <div class="overflow-x-auto flex-1 overflow-y-auto custom-scrollbar">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-slate-900/95 text-slate-400 font-semibold uppercase text-[11px] tracking-wider border-b border-slate-700 sticky top-0 z-10 shadow-md backdrop-blur-sm">
                        <tr>
                            <th class="px-6 py-4 whitespace-nowrap">Data Base</th>
                            <th class="px-6 py-4 whitespace-nowrap">Movimento</th>
                            <th class="px-6 py-4">Transportadora</th>
                            <th class="px-6 py-4">Placa</th>
                            <th class="px-6 py-4 text-right">Peso (t)</th>
                            <th class="px-6 py-4 text-right">Vol (m³)</th>
                            <th class="px-6 py-4 text-right">Ciclo (h)</th>
                            <th class="px-6 py-4 text-right">Fila Cpo (h)</th>
                            <th class="px-6 py-4 text-right">Carreg. (h)</th>
                            <th class="px-6 py-4 text-right">Fila Fáb (h)</th>
                        </tr>
                    </thead>
                    <tbody id="historicoGeralBody" class="divide-y divide-slate-800/80 text-slate-300"></tbody>
                </table>
            </div>
        </div>
    </section>
</div>
