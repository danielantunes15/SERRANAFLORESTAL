<div class="max-w-[96rem] mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-8 bg-slate-800/40 p-4 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
        <div>
            <h1 class="text-2xl font-extrabold text-white">Histórico de Jornadas</h1>
            <p class="text-sm text-slate-400 font-medium">Consulte, pesquise e audite a base de dados de motoristas na nuvem</p>
        </div>
    </div>

    <section class="animate-fade-in space-y-6">
        <div class="bg-slate-800/60 backdrop-blur-sm rounded-xl shadow-2xl overflow-hidden border border-slate-700/50 flex flex-col h-[calc(100vh-12rem)]">
            
            <div class="bg-slate-800/80 px-6 py-5 border-b border-slate-700 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                <h3 class="font-bold text-white tracking-wide flex items-center text-lg">
                    <i class="fas fa-database text-amber-500 mr-3"></i> Tabela Geral de Jornadas
                </h3>
                
                <div class="flex flex-col sm:flex-row items-center gap-3 w-full lg:w-auto">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <i class="fas fa-id-card text-emerald-400"></i>
                        <select id="filterMotoristaDropdown" class="bg-slate-900 text-white text-sm font-bold rounded-lg border border-emerald-800/50 px-3 py-2 cursor-pointer focus:outline-none focus:border-emerald-500 w-full sm:w-64 transition-colors">
                            <option value="ALL">TODOS OS MOTORISTAS</option>
                        </select>
                    </div>

                    <div class="relative w-full sm:w-auto">
                        <i class="fas fa-search absolute left-4 top-3 text-slate-500"></i>
                        <input type="text" id="searchHistoricoJornadas" placeholder="Buscar placa, nome livre..." class="bg-slate-900 text-white text-sm rounded-lg border border-slate-600 pl-10 pr-4 py-2 focus:outline-none focus:border-amber-500 w-full sm:w-64 shadow-inner placeholder-slate-500 transition-colors">
                    </div>
                </div>
            </div>
            
            <div class="overflow-x-auto flex-1 overflow-y-auto custom-scrollbar">
                <table class="min-w-full text-sm text-left">
                    <thead class="bg-slate-900/95 text-slate-400 font-semibold uppercase text-[11px] tracking-wider border-b border-slate-700 sticky top-0 z-10 shadow-md backdrop-blur-sm">
                        <tr>
                            <th class="px-6 py-4 whitespace-nowrap">Motorista</th>
                            <th class="px-6 py-4">Placa</th>
                            <th class="px-6 py-4">Início</th>
                            <th class="px-6 py-4">Fim</th>
                            <th class="px-6 py-4 text-center text-indigo-400">H. Noturnas</th>
                            <th class="px-6 py-4 text-center text-amber-400">H. Extras</th>
                            <th class="px-6 py-4 text-center">T. Trabalho</th>
                            <th class="px-6 py-4 text-center">Direção</th>
                            <th class="px-6 py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="historicoJornadasBody" class="divide-y divide-slate-800/80 text-slate-300"></tbody>
                </table>
            </div>
        </div>
    </section>
</div>
